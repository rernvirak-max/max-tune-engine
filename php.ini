; PHP settings for production (Nixpacks sets PHPRC=/app/php.ini, see nixpacks.toml).
; Nix's PHP ships no php.ini, so PHP's defaults (2M upload / 8M post) would apply.

; Headroom above the app's own 50 MB cap (max-tune.max_upload_kb) plus multipart overhead,
; so oversize files reach Laravel validation and get a proper JSON error.
upload_max_filesize = 64M
post_max_size = 64M

; Keep PHP warnings out of HTTP responses (they break headers and CORS); log to stderr instead.
display_errors = Off

; Keep real env vars out of $_ENV so `artisan serve` does not strip PHPRC from its `php -S` child.
variables_order = "GPCS"
